# Vendored libraries in lib/, managed by bin/manage-foreign-resources.js
#
# Same format as MediaWiki core's resources/lib/foreign-resources.yaml.
#
# To add or update a library (requires Node 21+):
# 1. Set `src` (and `version`). For npm packages use the registry tarball, and copy
#    the published hash from `npm view <package>@<version> dist.integrity`.
#    For other sources, leave `integrity` empty and run `npm run foreign-resources make-sri <name>`.
# 2. Run `npm run foreign-resources update <name>`
#
# `npm run foreign-resources verify` checks that lib/ matches upstream exactly.
#
# Types: file, multi-file, tar, zip, doc-only (see core's file for details).
# For tar/zip, `dest` maps globs within the archive to a subdirectory of lib/<name>/
# (null for the root). `exclude` (not in core) lists globs, relative to lib/<name>/, to leave out.
#
# `name` (not in core) and `authors` are used for the MediaWiki extension's Special:Version credits.
#
# lib/codex-design-tokens is managed by `grunt copy:codex` as an npm devDependency instead.

